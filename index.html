<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectus Alimentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0d1a12; font-family: sans-serif; }
        .gradient-card { background: linear-gradient(135deg, #1a3c2a 0%, #0d1a12 100%); border: 1px solid #c5a059; }
        .text-gold { color: #c5a059; }
        .bg-gold { background-color: #c5a059; }
        .btn-action { transition: all 0.2s; }
        .btn-action:active { transform: scale(0.95); }
        .category-header { color: #c5a059; border-left: 3px solid #c5a059; padding-left: 10px; }
    </style>
</head>
<body class="text-white min-h-screen p-4">
    <div id="app" class="max-w-md mx-auto">
        <div id="header" class="text-center mb-6">
            <img src="https://i.imgur.com/vHqQJ5I.png" alt="Selectus Logo" class="mx-auto w-32 mb-2">
            <h1 class="text-xl font-bold text-gold">App de Lançamentos</h1>
        </div>
        <div id="main-container"></div>
    </div>

    <script>
        const state = { view: 'home', location: null, action: null, currentQuantities: {} };
        
        // Lista completa de produtos (Descartes)
        const descartesPadrao = [
            { id: "d1", name: "SANDUICHE DE ATUM", category: "SANDUICHES" },
            { id: "d2", name: "SANDUICHE DE FRANGO COM REQUEIJÃO", category: "SANDUICHES" },
            { id: "d3", name: "SANDUICHE DE MANDIOQUINHA COM FRANGO", category: "SANDUICHES" },
            { id: "d4", name: "SANDUICHE DE PEITO DE PERU", category: "SANDUICHES" },
            { id: "d5", name: "SANDUICHE DE ROSBIFE E CEBOLA CARAMELIZADA", category: "SANDUICHES" },
            { id: "d6", name: "SALADA CAESAR GOURMET - N", category: "SALADAS GOURMET" },
            { id: "d7", name: "SALADA DE CAMARAO - N - 220G", category: "SALADAS GOURMET" },
            { id: "d8", name: "SALADA FUSILLI E POLLO", category: "SALADAS GOURMET" },
            { id: "d9", name: "SALADA ITALIAN GOURMET", category: "SALADAS GOURMET" },
            { id: "d10", name: "SALADA PESTO COM PROTEINA", category: "SALADAS GOURMET" },
            { id: "d11", name: "SALADA TERIYAKI COM PROTEINA - N", category: "SALADAS GOURMET" },
            { id: "d12", name: "MANGA EM PEDAÇOS", category: "FRUTAS" },
            { id: "d13", name: "MIX DE FRUTAS UVA E MANGA - 150G", category: "FRUTAS" },
            { id: "d14", name: "MIX DE FRUTAS UVA E MELAO", category: "FRUTAS" },
            { id: "d15", name: "TANGERINA DESCASCADA", category: "FRUTAS" },
            { id: "d16", name: "CUSCUZ", category: "CUSCUZ" },
            { id: "d17", name: "BRIGADEIRO DE COLHER", category: "SOBREMESAS" },
            { id: "d18", name: "GELATINA DE MORANGO", category: "SOBREMESAS" },
            { id: "d19", name: "GELATINA DE UVA", category: "SOBREMESAS" },
            { id: "d20", name: "PUDIM", category: "SOBREMESAS" },
            { id: "d21", name: "OVERNIGHT 180g", category: "SOBREMESAS" }
        ];

        const amaroCafes = ["EXPRESSO", "CURTO", "DUPLO", "AMERICANO", "CAPPUCCINO", "CAFÉ COM LEITE", "CAFÉ COM LEITE CURTO", "ACHOCOLATO KITKAT", "CAPPUCCINO ALPINO", "ACHOCOLATADO ALPINO", "MOCACCINO DOIS FRADES", "ACHOCOLATADO DOIS FRADES"];
        const cafesBase = ["CAFÉ CURTO", "CAFÉ LONGO", "CAFÉ PINGADO", "CAPPUCCINO", "MOCACCINO", "CHOCOLATE", "CHOCOLATE COM LEITE", "LEITE", "CAFÉ SOLÚVEL"];

        const menuData = {
            "Agnus": { 
                cafes: ["CAFÉ CURTO", "CAFÉ LONGO", "CAPPUCCINO", "CAFÉ PINGADO", "MOCACCINO", "CAPPUCCINO COM CANELA", "CHOCOLATE COM LEITE", "CHOCOLATE", "AGUA QUENTE"].map(n => ({name: n, cat: "Geral"})), 
                descartes: descartesPadrao 
            },
            "Izabel": { 
                cafes: ["CAFÉ CURTO", "CAFÉ LONGO", "CAFÉ PINGADO", "CAPPUCCINO", "MOCACCINO", "CHOCOLATE", "CHOCOLATE COM LEITE", "LEITE", "CAPPUCCINO COM CANELA"].map(n => ({name: n, cat: "Geral"})), 
                descartes: descartesPadrao 
            },
            "Amaro": {
                cafes: [...amaroCafes.map(n => ({name: n, cat: "Máquina CC"})), ...amaroCafes.map(n => ({name: n, cat: "Máquina CO"}))],
                descartes: descartesPadrao
            },
            "Portugues": {
                cafes: [...cafesBase.map(n => ({name: n, cat: "Máquina CC"})), ...cafesBase.map(n => ({name: n, cat: "Máquina CO"})), ...cafesBase.map(n => ({name: n, cat: "Máquina DAY"}))],
                descartes: descartesPadrao
            }
        };

        function render() {
            const container = document.getElementById('main-container');
            container.innerHTML = '';

            if (state.view === 'home') {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        ${["Agnus", "Izabel", "Amaro", "Portugues"].map(loc => `
                            <button onclick="selectLocation('${loc}')" class="gradient-card p-6 rounded-2xl shadow-lg text-center flex flex-col items-center">
                                <span class="font-bold text-lg text-gold">${loc}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (state.view === 'action') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <button onclick="selectAction('cafe')" class="w-full gradient-card p-6 rounded-2xl flex items-center justify-center gap-3 text-gold">
                            <i data-lucide="coffee"></i> <span class="text-lg">Café</span>
                        </button>
                        <button onclick="selectAction('descarte')" class="w-full gradient-card p-6 rounded-2xl flex items-center justify-center gap-3 text-gold">
                            <i data-lucide="trash-2"></i> <span class="text-lg">Descartes</span>
                        </button>
                        <button onclick="goBack()" class="w-full bg-transparent border border-gray-600 p-4 rounded-xl mt-4 text-gray-400">Voltar</button>
                    </div>
                `;
            } else if (state.view === 'form') {
                renderForm();
            }
            lucide.createIcons();
        }

        function renderForm() {
            const container = document.getElementById('main-container');
            const items = state.action === 'cafe' ? menuData[state.location].cafes : menuData[state.location].descartes;
            
            container.innerHTML = `
                <input type="text" id="search" placeholder="Pesquisar..." class="w-full p-3 rounded-xl mb-4 bg-gray-800 text-white border border-gray-600" oninput="filterItems()">
                <div id="form-items" class="space-y-4"></div>
                <button onclick="saveEntry()" class="w-full bg-gold text-black font-bold p-4 rounded-xl mt-6">Salvar Lançamento</button>
                <button onclick="goBack()" class="w-full bg-transparent border border-gray-600 p-4 rounded-xl mt-2">Voltar</button>
            `;

            const itemsDiv = document.getElementById('form-items');
            items.forEach(item => {
                const name = item.name;
                const cat = item.cat || item.category;
                const div = document.createElement('div');
                div.className = 'item-row bg-white/5 p-3 rounded-xl flex items-center justify-between border border-white/10';
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-[10px] text-gold uppercase tracking-wider font-bold">${cat}</span>
                        <span class="font-medium text-sm">${name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQty('${name}', -1, '${name.replace(/ /g, '_')}')" class="p-2 bg-gray-700 rounded-lg">-</button>
                        <input type="number" id="${name.replace(/ /g, '_')}" value="0" class="w-16 text-center bg-transparent border-b border-gray-500 text-white" onchange="manualUpdate('${name}', this.value)">
                        <button onclick="updateQty('${name}', 1, '${name.replace(/ /g, '_')}')" class="p-2 bg-gold text-black rounded-lg">+</button>
                    </div>
                `;
                itemsDiv.appendChild(div);
            });
        }

        function filterItems() {
            const term = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.item-row').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(term) ? 'flex' : 'none';
            });
        }

        function updateQty(name, change, id) {
            state.currentQuantities[name] = (state.currentQuantities[name] || 0) + change;
            if (state.currentQuantities[name] < 0) state.currentQuantities[name] = 0;
            document.getElementById(id).value = state.currentQuantities[name];
        }

        function manualUpdate(name, val) {
            state.currentQuantities[name] = parseInt(val) || 0;
        }

        async function saveEntry() {
            const entries = Object.entries(state.currentQuantities).filter(([_, qty]) => qty > 0);
            if (entries.length === 0) return alert("Adicione pelo menos um item!");

            const payload = {
                date: new Date().toISOString().split('T')[0],
                timestamp: new Date().toLocaleTimeString(),
                location: state.location,
                type: state.action === 'cafe' ? 'Café' : 'Descarte',
                items: entries.map(([name, qty]) => ({
                    category: state.action === 'cafe' ? menuData[state.location].cafes.find(c => c.name === name).cat : menuData[state.location].descartes.find(c => c.name === name).category,
                    name: name,
                    qty: qty
                }))
            };

            fetch("SUA_URL_DO_GOOGLE_SCRIPT_AQUI", {
                method: "POST",
                body: JSON.stringify(payload)
            }).then(() => {
                state.currentQuantities = {};
                alert("Salvo com sucesso!");
                goBack();
            });
        }

        function selectLocation(loc) { state.location = loc; state.view = 'action'; render(); }
        function selectAction(act) { state.action = act; state.view = 'form'; render(); }
        function goBack() { state.view = 'home'; render(); }

        render();
    </script>
</body>
</html>
